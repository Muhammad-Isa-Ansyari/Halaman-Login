<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page with Image</title>
    <link rel="stylesheet" href="style-with-image.css">
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="https://media.istockphoto.com/id/1317323736/id/foto/pemandangan-ke-langit-arah-pepohonan.jpg?s=612x612&w=0&k=20&c=QlE8lwceZ9MMLt7ibYVwN0IeFeazLlB_37Ezb7Br0Fc=" alt="Login Image">
        </div>
        <div class="login-form">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter Password">
                </div>
                <button type="button" id="loginBtn">Login</button>
            </form>
            <p id="errorMsg" class="error"></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script1.js"></script>
</body>
</html>
